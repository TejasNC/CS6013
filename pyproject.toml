[project]
name = "cs6013-efficient-ai"
version = "0.1.0"
description = "CS6013 Fall 2026 Efficient AI: model compression pipeline (dataset setup, size check, local eval against the TA harness)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.12.1",
    "transformers==5.16.1",
    "accelerate==1.14.0",
    "datasets==5.0.1",
    "huggingface-hub==1.29.0",
    "peft==0.18.0",
    "optimum==2.3.0",
    "gptqmodel==7.3.2",
    "openai>=3.0.0",
    "pyyaml>=6.0",
    # vllm is intentionally not pinned here -- install separately per its
    # own instructions (CUDA-version-specific wheel); see pipeline/README
    # or the TA eval repo's own serving instructions.
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]
exclude = ["pipeline.results*"]
